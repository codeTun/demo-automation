apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue
  template:
    metadata:
      labels:
        app: queue
    spec:
      containers:
      - name: queue
        # The pipeline replaces this line with the image tagged by the commit.
        image: iheb770/fleetman-queue:latest
        ports:
        - containerPort: 8161
        - containerPort: 61616
        # The pod receives traffic only once this check succeeds.
        readinessProbe:
          tcpSocket:
            port: 61616
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fleetman-queue
spec:
  selector:
    app: queue
  ports:
    - name: http          # ActiveMQ admin console
      port: 8161
      nodePort: 30010
    - name: endpoint      # port used by the other microservices to send and read messages
      port: 61616
  type: NodePort
