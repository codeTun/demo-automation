apiVersion: apps/v1
kind: Deployment
metadata:
  name: position-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: position-tracker
  template:
    metadata:
      labels:
        app: position-tracker
    spec:
      containers:
      - name: position-tracker
        # The pipeline replaces this line with the image tagged by the commit.
        image: iheb770/fleetman-position-tracker:latest
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production-microservice
        ports:
        - containerPort: 8080
        # The pod receives traffic only once this check succeeds.
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fleetman-position-tracker
spec:
  selector:
    app: position-tracker
  ports:
    - name: http
      port: 8080
  type: ClusterIP
