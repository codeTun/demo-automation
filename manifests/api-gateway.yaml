apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        # The pipeline replaces this line with the image tagged by the commit.
        image: iheb770/fleetman-api-gateway:latest
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production-microservice
        ports:
        - containerPort: 8080
        # The pod receives traffic only once this check succeeds.
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fleetman-api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      nodePort: 30020
  type: NodePort
